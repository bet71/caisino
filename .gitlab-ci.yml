stages: [lint, test, build]
lint:
  stage: lint
  image: python:3.12-slim
  script: [pip install ruff -q, ruff check .]
test:
  stage: test
  image: python:3.12-slim
  script: [pip install -r services/api/requirements.txt -q, pytest -q tests/]
build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script: [docker build -t casino-api services/api]
