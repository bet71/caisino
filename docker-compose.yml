services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: casino, POSTGRES_PASSWORD: casino, POSTGRES_DB: casino}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U casino"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  api:
    build: ./services/api
    env_file: .env
    environment: {DATABASE_URL: postgresql+asyncpg://casino:casino@db:5432/casino, REDIS_URL: redis://redis:6379/0}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8080:8080"]
  worker:
    build: ./services/api
    command: python -m worker.main
    env_file: .env
    depends_on: {api: {condition: service_started}}
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
    depends_on: [api]
volumes: {pgdata: {}, redisdata: {}}
